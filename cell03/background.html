<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        
        #background {
            background-color: aliceblue;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #center {
            text-align: center;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .button:hover {
            background-color: #45a049;
        }
        
        #rgba {
            font-family: monospace;
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="background">
        <div id="center">
            <button onclick="randomColor()" class="button">Random Color</button>
            <p id="rgba">rgba(240, 248, 255, 1)</p>
        </div>
    </div>    

    <script>
        function randomColor() {
            let colorPalette = [];
            
            // Generate 3 random RGB values (0-255)
            for (let i = 0; i < 3; i++) {
                colorPalette[i] = Math.floor(Math.random() * 256);
            }
            
            // Generate random alpha value (0-1) with 2 decimal places
            colorPalette[3] = Math.random().toFixed(2);
            
            let rgbaExp = `rgba(${colorPalette[0]}, ${colorPalette[1]}, ${colorPalette[2]}, ${colorPalette[3]})`;
            console.log(rgbaExp);
            
            document.getElementById("background").style.backgroundColor = rgbaExp;
            document.getElementById("rgba").textContent = rgbaExp;
        }
    </script>
</body>
</html>
